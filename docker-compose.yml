

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    restart: unless-stopped

  api:
    build: ./api
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=dev-secret-change-in-production-at-least-64-chars-long
      - MOSS_MICROSERVICE_URL=http://moss-worker:5000
      - NODE_ENV=development
      - PORT=4000
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      - moss-worker
    restart: unless-stopped

  moss-worker:
    build: ./moss-worker
    environment:
      - DATABASE_URL=file:./dev.db
      - MOSS_USER_ID=${MOSS_USER_ID:-0}
    volumes:
      - ./moss-worker:/app
    restart: unless-stopped